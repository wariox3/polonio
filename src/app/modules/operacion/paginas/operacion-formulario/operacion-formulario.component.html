<form [formGroup]="formularioOperacion" (ngSubmit)="onSubmit()">
  <div class="flex gap-2 mb-4">
    <a class="btn btn-secondary" routerLink="/administracion/operacion/lista"> Atrás </a>
    <button type="submit" class="btn btn-primary">Guardar</button>
  </div>
  <div class="card">
    <div class="card-header">
      <h3 class="card-title">
        {{ detalleID() > 0 ? 'Editar operación' : 'Registro de operación' }}
      </h3>
    </div>
    <div class="card-body">
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div>
          <app-label [required]="true">Ciudad</app-label>
          <app-select-search
            [control]="getControl('ciudad')"
            [errors]="{ required: 'Este campo es requerido.' }"
            [endpoint]="'general/ciudad/seleccionar/'"
            [campoBusqueda]="'nombre__icontains'"
            [parametrosEndpoint]="{
              nombre__icontains: formularioOperacion.get('ciudad_nombre').value,
              limit: 10,
            }"
          ></app-select-search>
        </div>
        <div>
          <app-label [required]="true">Nombre</app-label>
          <app-input
            formControlName="nombre"
            [type]="'text'"
            [control]="formularioOperacion.get('nombre')"
            [errors]="{ required: 'Campo obligatorio.', maxLength: 'Máximo 50 caracteres.' }"
          ></app-input>
        </div>
      </div>
    </div>
  </div>
</form>
