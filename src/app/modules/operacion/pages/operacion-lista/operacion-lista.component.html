<div class="card mb-5">
  <div class="card-header">
    <h3 class="card-title">Filtros</h3>
  </div>
  <div class="card-body">
    <app-filtro
      (filtersApply)="onFiltersChange($event)"
      [availableFields]="camposFiltros"
    ></app-filtro>
  </div>
</div>

<div class="card mb-5">
  <div class="card-header">
    <h3 class="card-title">Operación</h3>
  </div>
  <div class="card-body">
    <div class="flex justify-between mb-4 gap-2">
      <ui-paginador
        [totalItems]="estadoPaginacion().totalItems"
        [itemsPerPage]="estadoPaginacion().itemsPorPagina"
        (pageChange)="onPageChange($event)"
      ></ui-paginador>
      <div class="flex">
        <a class="btn btn-primary rounded-r-none" routerLink="/administracion/operacion/nuevo">
          Nuevo
        </a>
        <button
          class="btn btn-danger rounded-l-none"
          (click)="eliminar()"
          [disabled]="operacionSeleccionadas().length === 0"
        >
          Eliminar
        </button>
      </div>
    </div>
    <ui-tabla
      [columnas]="columnas"
      [datos]="operaciones()"
      [rutas]="{
        editar: '/administracion/operacion/editar',
        detalle: '/administracion/operacion/detalle',
      }"
      (seleccionCambiada)="onSeleccionOperacion($event)"
      [maxHeight]="'800px'"
    ></ui-tabla>
  </div>
</div>
