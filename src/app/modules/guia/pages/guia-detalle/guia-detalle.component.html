<div class="flex mb-4 items-center justify-between gap-4">
  <a class="btn btn-secondary" routerLink="/movimiento/guia/lista"> Atrás </a>
  <div>
    <app-estado-badges-container
      [datos]="guiaSignal()"
      [configuracion]="configuracionEstados"
    ></app-estado-badges-container>
  </div>
</div>
<div class="card">
  <div class="card-header">
    <h3 class="card-title">Detalle guía - {{ guiaSignal().id }}</h3>
  </div>
  <div class="card-body">
    <section class="mb-4">
      <app-tabla-detalles
        [datos]="guiaSignal()"
        [campos]="camposDetalleGuia()"
        [columnas]="6"
      ></app-tabla-detalles>
    </section>
    <section class="mb-4">
      <app-tabla-detalles
        [datos]="guiaSignal()"
        [campos]="camposDetalleDestinatario()"
        [columnas]="4"
      ></app-tabla-detalles>
    </section>
    <div class="border-b border-gray-200 mb-4">
      <nav class="flex -mb-px pl-8">
        <button
          class="mr-8 py-4 px-1 border-b-2 font-medium text-sm"
          [class]="
            activeTab === 'despacho'
              ? 'border-blue-500 text-blue-600'
              : 'border-transparent text-gray-500 hover:text-gray-700 hover:border-gray-300'
          "
          (click)="activeTab = 'despacho'"
        >
          Despacho
        </button>
      </nav>
    </div>
    <div *ngIf="activeTab === 'despacho'" class="overflow-x-auto">
      <app-guia-tab-despacho></app-guia-tab-despacho>
    </div>
  </div>
</div>
