<div class="flex mb-4 items-center justify-between gap-4">
  <div class="flex gap-2 mb-4">
    <a class="btn btn-secondary" routerLink="/movimiento/guia/lista"> Atrás </a>
    <div
      class="dropdown"
      data-dropdown="true"
      data-dropdown-trigger="click"
      data-dropdown-dismiss="true"
    >
      <button class="dropdown-toggle btn btn-secondary flex items-center rounded-r-none">
        Formatos
      </button>
      <div class="dropdown-content w-full max-w-56 py-2">
        <div class="menu menu-default flex flex-col w-full">
          <div class="menu-item">
            <button class="menu-link">
              <span class="menu-icon">
                <i class="ki-filled ki-document"></i>
              </span>
              <span class="menu-title">Formato 1</span>
            </button>
            <button class="menu-link">
              <span class="menu-icon">
                <i class="ki-filled ki-document"></i>
              </span>
              <span class="menu-title">Formato 2</span>
            </button>
            <button class="menu-link">
              <span class="menu-icon">
                <i class="ki-filled ki-document"></i>
              </span>
              <span class="menu-title">Rotulo</span>
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>
  <div>
    <app-estado-badges-container
      [datos]="guiaSignal()"
      [configuracion]="configuracionEstados"
    ></app-estado-badges-container>
  </div>
</div>
<div class="card">
  <div class="card-header">
    <h3 class="card-title">Detalle guía - {{ guiaSignal().id }}</h3>
  </div>
  <div class="card-body">
    <section class="mb-4">
      <app-tabla-detalles
        [datos]="guiaSignal()"
        [campos]="camposDetalleGuia()"
        [columnas]="6"
      ></app-tabla-detalles>
    </section>
    <section class="mb-4">
      <app-tabla-detalles
        [datos]="guiaSignal()"
        [campos]="camposDetalleDestinatario()"
        [columnas]="4"
      ></app-tabla-detalles>
    </section>
    <div class="border-b border-gray-200 mb-4">
      <nav class="flex -mb-px pl-8">
        <button
          class="mr-8 py-4 px-1 border-b-2 font-medium text-sm"
          [class]="
            activeTab === 'despacho'
              ? 'border-blue-500 text-blue-600'
              : 'border-transparent text-gray-500 hover:text-gray-700 hover:border-gray-300'
          "
          (click)="activeTab = 'despacho'"
        >
          Despacho
        </button>
      </nav>
    </div>
    <div *ngIf="activeTab === 'despacho'" class="overflow-x-auto">
      <app-guia-tab-despacho></app-guia-tab-despacho>
    </div>
  </div>
</div>
