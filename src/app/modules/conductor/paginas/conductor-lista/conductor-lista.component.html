<div class="flex justify-between mb-4 gap-2">
  <app-paginador
    [totalItems]="estadoPaginacion().totalItems"
    [itemsPerPage]="estadoPaginacion().itemsPorPagina"
    (pageChange)="onPageChange($event)"
  ></app-paginador>

  <div class="flex gap-2">
    <a class="btn btn-primary" routerLink="/administracion/conductor/nuevo"> Nuevo </a>
    <button
      class="btn btn-danger"
      (click)="eliminar()"
      [disabled]="conductoresSeleccionados().length === 0"
    >
      Eliminar
    </button>
  </div>
</div>

<app-tabla
  [columnas]="columnas"
  [datos]="conductores()"
  [rutas]="{
    editar: '/administracion/conductor/editar',
    detalle: '/administracion/conductor/detalle',
  }"
  (seleccionCambiada)="onSeleccionConductores($event)"
></app-tabla>
