<div class="flex mb-4 items-center justify-between gap-4">
  <div class="flex gap-2 mb-4">
    <a class="btn btn-secondary" routerLink="/movimiento/despacho/lista"> Atrás </a>
    <button
      type="submit"
      class="btn btn-primary"
      (click)="confirmarAprobacion()"
      [disabled]="despachoSignal().estado_aprobado"
    >
      Aprobar
    </button>
  </div>
  <div>
    <app-estado-badges-container
      [datos]="despachoSignal()"
      [configuracion]="configuracionEstados"
    ></app-estado-badges-container>
  </div>
</div>

<div class="card">
  <div class="card-header">
    <h3 class="card-title">Detalle despacho - {{ despachoSignal().id }}</h3>
  </div>
  <div class="card-body">
    <section class="mb-4">
      <app-tabla-detalles
        [datos]="despachoSignal()"
        [campos]="camposDetalle()"
        [columnas]="6"
      ></app-tabla-detalles>
    </section>
    <div class="border-b border-gray-200 mb-4">
      <nav class="flex -mb-px pl-8">
        <button
          class="mr-8 py-4 px-1 border-b-2 font-medium text-sm"
          [class]="
            activeTab === 'guia'
              ? 'border-blue-500 text-blue-600'
              : 'border-transparent text-gray-500 hover:text-gray-700 hover:border-gray-300'
          "
          (click)="activeTab = 'guia'"
        >
          Guia
        </button>
      </nav>
    </div>
    <div *ngIf="activeTab === 'guia'" class="overflow-x-auto">
      <app-despacho-tab-guia [despacho]="despachoSignal()"></app-despacho-tab-guia>
    </div>
  </div>
</div>
